[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnt-sim"
version = "0.1.0"
description = "Penn & Turner space-syntax agent simulator. Consumes a Web-Based JuPedSim scenario, emits a JuPedSim-format sqlite trajectory."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "tqdm>=4.65",
]

[project.scripts]
pnt-sim = "pnt_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pnt_sim*"]
